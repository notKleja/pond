name: Package desktop

on:
  push:
    branches: [windows-port]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            command: pnpm dist:win
            artifacts: |
              apps/desktop/dist/Pond-*-x64.exe
              apps/desktop/dist/Pond-*-x64.exe.blockmap
              apps/desktop/dist/latest.yml
          - name: macos-arm64-unsigned
            os: macos-latest
            command: pnpm dist:mac:arm64
            artifacts: |
              apps/desktop/dist/Pond-*-arm64.dmg
              apps/desktop/dist/Pond-*-arm64.zip
              apps/desktop/dist/*.blockmap
              apps/desktop/dist/latest-mac.yml
          - name: macos-x64-unsigned
            os: macos-15-intel
            command: pnpm dist:mac:x64
            artifacts: |
              apps/desktop/dist/Pond-*-x64.dmg
              apps/desktop/dist/Pond-*-x64.zip
              apps/desktop/dist/*.blockmap
              apps/desktop/dist/latest-mac.yml

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck desktop
        run: pnpm --filter @pond/desktop typecheck

      - name: Verify Windows port behavior
        env:
          ELECTRON_RUN_AS_NODE: "1"
        run: >-
          pnpm --filter @pond/desktop exec electron node_modules/vitest/vitest.mjs run
          src/main/native/frame.test.ts
          src/main/native/manifests.test.ts
          src/main/native/paths.test.ts
          src/main/native/rpc.test.ts
          src/main/native/server.test.ts
          src/main/core/library-replication-concurrency.test.ts
          src/main/core/library-replication-protocol.test.ts
          src/main/core/library-replication.test.ts

      - name: Verify architecture boundaries
        run: pnpm architecture:check

      - name: Package desktop app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.command }}

      - name: Upload package artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14
