name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: macos-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Turborepo Remote Cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Verify release versions
        run: |
          RELEASE_VERSION="${GITHUB_REF_NAME#v}" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const releaseVersion = process.env.RELEASE_VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(releaseVersion)) {
            throw new Error(`Release tag ${process.env.GITHUB_REF_NAME} must use vX.Y.Z`);
          }

          const readJsonVersion = (path) =>
            JSON.parse(readFileSync(path, "utf8")).version;
          const readSourceVersion = (path, pattern) => {
            const match = readFileSync(path, "utf8").match(pattern);
            if (!match) throw new Error(`Version not found in ${path}`);
            return match[1];
          };
          const versions = [
            ["apps/desktop/package.json", readJsonVersion("apps/desktop/package.json")],
            ["apps/extension/package.json", readJsonVersion("apps/extension/package.json")],
            [
              "apps/extension/wxt.config.ts",
              readSourceVersion(
                "apps/extension/wxt.config.ts",
                /manifest:\s*\{[\s\S]*?\bversion:\s*"([^"]+)"/,
              ),
            ],
            [
              "apps/website/lib/release.ts",
              readSourceVersion(
                "apps/website/lib/release.ts",
                /POND_VERSION\s*=\s*"([^"]+)"/,
              ),
            ],
          ];
          const mismatches = versions.filter(([, version]) => version !== releaseVersion);
          if (mismatches.length) {
            for (const [path, version] of mismatches) {
              console.error(`${path} has ${version}; expected ${releaseVersion}`);
            }
            process.exit(1);
          }
          NODE

      - name: Generated files are up to date
        run: pnpm generate && git diff --exit-code

      - name: Verify workspace
        run: pnpm check


      - name: Build workspace
        run: pnpm build

      - name: Desktop end-to-end smoke
        run: pnpm --filter @pond/desktop smoke:desktop

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "Pond ${GITHUB_REF_NAME#v}" --notes ""
          fi

      - name: Build extension zip
        run: pnpm --filter @pond/extension zip

      - name: Upload extension zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP=$(find apps/extension/.output -name "*.zip" -type f | head -1)
          if [ -z "$ZIP" ]; then
            echo "Extension zip not found under apps/extension/.output"
            exit 1
          fi
          cp "$ZIP" "pond-extension-${VERSION}.zip"
          gh release upload "$GITHUB_REF_NAME" "pond-extension-${VERSION}.zip" --clobber

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
            command: pnpm dist:mac:arm64
          - arch: x64
            os: macos-15-intel
            command: pnpm dist:mac:x64
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Turborepo Remote Cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Require signing credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Package macOS app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ${{ matrix.command }}

      - name: Stage macOS release artifacts
        run: |
          mkdir "release-macos-${{ matrix.arch }}"
          cp apps/desktop/dist/Pond-*-${{ matrix.arch }}.dmg "release-macos-${{ matrix.arch }}/"
          cp apps/desktop/dist/Pond-*-${{ matrix.arch }}.zip "release-macos-${{ matrix.arch }}/"
          cp apps/desktop/dist/Pond-*-${{ matrix.arch }}.*.blockmap "release-macos-${{ matrix.arch }}/"

      - name: Upload macOS release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-macos-${{ matrix.arch }}
          path: release-macos-${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 1

  macos-publish:
    needs: [prepare, macos]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v7
        with:
          pattern: release-macos-*
          path: macos-artifacts
          merge-multiple: true

      - name: Write combined macOS updater metadata
        run: node scripts/write-mac-update-metadata.mjs macos-artifacts "${GITHUB_REF_NAME#v}"

      - name: Upload macOS artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" macos-artifacts/* --clobber

  windows:
    needs: prepare
    runs-on: windows-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Turborepo Remote Cache
        if: ${{ vars.TURBO_TEAM != '' }}
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Package Windows app and upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm dist:win:publish

  publish:
    needs: [macos-publish, windows]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
